<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gọi video – Tomortle × Molly</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;600;800&family=Patrick+Hand&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=16">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
.callbox{position:relative;width:100%;aspect-ratio:3/4;max-height:72vh;background:#16121c;border-radius:20px;overflow:hidden;margin:0 auto}
@media(min-width:700px){.callbox{aspect-ratio:16/10}}
.callbox video{width:100%;height:100%;object-fit:cover;display:block}
#vMe{position:absolute;right:10px;top:10px;width:28%;height:auto;aspect-ratio:3/4;border-radius:14px;border:2px solid rgba(255,255,255,.7);z-index:2;background:#000;transform:scaleX(-1)}
#vMe.back{transform:none}
.cstate{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#fff;padding:20px;z-index:1}
.cstate .av{width:96px;height:96px;font-size:50px;margin-bottom:10px}
.ctimer{position:absolute;left:12px;top:12px;z-index:3;background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.cbar{display:flex;justify-content:center;gap:12px;margin:14px 0}
.cbar button{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:24px;cursor:pointer}
.cbar button.off{background:#555;color:#fff}
.cbar .end{background:#e53935;border-color:#e53935;color:#fff}
.cbar .start{background:#2ecc71;border-color:#2ecc71;color:#fff;width:auto;border-radius:999px;padding:0 22px;font-size:17px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.snapov{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none}.snapov b{font-size:110px;line-height:1;font-family:var(--head),serif}.snapov span{font-weight:700;margin-top:6px}
.snapflash{position:absolute;inset:0;z-index:5;background:#fff;opacity:0;pointer-events:none}.snapflash.go{animation:sflash .45s}@keyframes sflash{0%{opacity:.95}100%{opacity:0}}
.snapres{position:fixed;inset:0;z-index:60;background:rgba(20,10,20,.5);display:flex;align-items:center;justify-content:center;padding:14px}.snapres .card{max-width:440px;width:100%}
.stats div{background:var(--soft);border-radius:14px;padding:10px 4px}
.stats b{display:block;font-size:20px;font-family:var(--head),serif;color:var(--accent)}
.stats span{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <div class="callbox" id="box">
    <video id="vThem" autoplay playsinline></video>
    <video id="vMe" autoplay playsinline muted class="hidden"></video>
    <div class="ctimer hidden" id="timer">00:00</div>
    <div class="snapov hidden" id="snapOv"><b id="snapNum"></b><span id="snapLbl"></span></div><div class="snapflash" id="snapFlash"></div>
    <div class="cstate" id="cstate"><div class="av" id="pav">🙂</div><b id="cmsg" style="font-size:18px"></b><span id="csub" class="note" style="color:#ddd"></span></div>
  </div>
  <div class="cbar" id="preBar">
    <button class="start" id="btnVideo">📹 Gọi video</button>
    <button class="start" id="btnAudio" style="background:var(--accent);border-color:var(--accent)">📞 Gọi thoại</button>
  </div>
  <div class="cbar" id="preBar2"><button class="start" id="btnSleep" style="background:#3d3a6b;border-color:#3d3a6b">🌙 Ngủ cùng nhau</button></div>
  <div class="cbar hidden" id="inBar">
    <button id="btnMic" title="Tắt/bật mic">🎤</button>
    <button id="btnCam" title="Tắt/bật camera">📷</button>
    <button id="btnFlip" title="Đổi camera">🔄</button>
    <button id="btnSnap" title="Chụp photobooth cùng nhau" style="background:#ffd6e6">📸</button>
    <button class="end" id="btnEnd" title="Kết thúc">✆</button>
  </div>
  <div class="snapres hidden" id="snapRes"><div class="card" style="padding:14px;text-align:center"><b>📸 Photobooth trong cuộc gọi</b><img id="snapImg" alt="" style="display:block;width:100%;max-height:60vh;object-fit:contain;margin:10px 0;border-radius:10px">
    <div class="row" style="gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn primary" id="snapSave">💾 Lưu về máy</button><button class="btn" id="snapEdit">✨ Chỉnh trong Booth</button><button class="btn" id="snapClose">Đóng</button></div></div></div>
  <p class="note center" id="hint">Bấm gọi, máy người ấy sẽ nhận lời mời. Khi người ấy vào, cuộc gọi tự kết nối.</p>

  <div class="card">
    <h3>⏱️ Thời gian gọi nhau</h3>
    <div class="stats"><div><b id="sToday">0'</b><span>Hôm nay</span></div><div><b id="sWeek">0'</b><span>7 ngày qua</span></div><div><b id="sAll">0'</b><span>Tổng cộng</span></div></div>
    <p class="note center" id="sLong"></p>
    <h3 style="margin-top:14px">📜 Lịch sử cuộc gọi</h3>
    <div class="list" id="hist"></div>
  </div>
</div>
<div id="sleepOv" class="hidden" style="position:fixed;inset:0;z-index:90;background:#07061a;color:#cfc9ff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px">
  <div style="font-size:64px" id="slMoon">🌙</div>
  <div id="slClock" style="font-size:54px;font-weight:800;font-variant-numeric:tabular-nums;margin:6px 0"></div>
  <div id="slWho" style="font-size:16px;opacity:.85"></div>
  <div id="slCtl" style="margin-top:22px;transition:opacity .6s">
    <div class="note" style="color:#9a94d9">Tự tắt sau</div>
    <div class="chips" id="slTimer" style="justify-content:center;margin:8px 0"></div>
    <div class="chips" id="slNoise" style="justify-content:center;margin:8px 0"></div>
    <div class="row" style="gap:10px;justify-content:center;margin-top:10px"><button class="btn" id="slMic">🎤 Mic đang bật</button><button class="btn" id="slEnd" style="background:#e53935;color:#fff;border-color:#e53935">Kết thúc</button></div>
    <p class="note" style="color:#6f69b0;margin-top:14px">Để máy cắm sạc, úp màn hình xuống. Chạm vào màn hình để hiện nút.</p>
  </div>
</div>
<style>#sleepOv .chips button{background:#16143a;color:#cfc9ff;border:1px solid #2c2870;border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer}#sleepOv .chips button.on{background:#6c63ff;color:#fff}</style>
<div id="toast"></div><div class="fx" id="fx"></div>
<script type="module">
import { $, $$, esc, toast, vib, sb, boot, header, joinMain, invite, featureChannel , getIce, uploadMedia } from './common.js';
const PAGE = 'call';
header('Gọi video');
const ctx = await boot();
const ME = ctx.me.id, YOU = ctx.partnerId, CALLER = ME < YOU; // one fixed side places the WebRTC call
$('#pav').textContent = ctx.partnerProfile.emoji || '🙂';
let ICE = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }] };
getIce(ICE).then(c => { ICE = c; window.__ice = c });
const pid = id => 'tmx-' + ctx.couple.channel_key.slice(0, 8) + '-' + id.slice(0, 8);
const ch = featureChannel(ctx, 'call');
const send = (event, payload = {}) => ch.send({ type: 'broadcast', event, payload });

let iStarted = false, readyLoop = null;
let sleepMode = false, sleepEnd = 0, sleepTick = null, wakeLock = null, noise = null;
let state = 'idle', kind = 'video', stream = null, peer = null, call = null, startedAt = null, tick = null, facing = 'user', micOn = true, camOn = true, logged = false;
function setMsg(m, s = '') { $('#cmsg').textContent = m; $('#csub').textContent = s; $('#cstate').classList.toggle('hidden', !m) }
function setState(s) {
  state = s;
  $('#preBar').classList.toggle('hidden', s !== 'idle'); $('#preBar2').classList.toggle('hidden', s !== 'idle'); $('#inBar').classList.toggle('hidden', s === 'idle');
  $('#hint').classList.toggle('hidden', s !== 'idle'); $('#timer').classList.toggle('hidden', s !== 'live');
  $('#btnCam').classList.toggle('hidden', kind !== 'video'); $('#btnFlip').classList.toggle('hidden', kind !== 'video'); $('#btnSnap').classList.toggle('hidden', kind !== 'video' || s !== 'live');
  if (s === 'idle') setMsg(ctx.partnerName, ctx.partnerHere ? `${ctx.partnerName} đang ở trang gọi` : (ctx.partnerOnline ? `${ctx.partnerName} đang online` : `${ctx.partnerName} đang offline`));
}
joinMain(ctx, PAGE, () => { if (state === 'idle') setState('idle'); if (ctx.partnerHere && state === 'waiting') announceReady() });

async function getMedia() {
  const want = { audio: { echoCancellation: true, noiseSuppression: true }, video: kind === 'video' ? { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } } : false };
  stream = await navigator.mediaDevices.getUserMedia(want);
  if (kind === 'video') { $('#vMe').srcObject = stream; $('#vMe').classList.remove('hidden'); $('#vMe').classList.toggle('back', facing !== 'user') }
}
function initPeer() {
  return new Promise((res, rej) => {
    if (typeof Peer === 'undefined') { rej(new Error('Không tải được thư viện gọi (PeerJS)')); return }
    peer = new Peer(pid(ME), { config: ICE, debug: 1 });
    peer.on('open', () => res());
    peer.on('error', e => { if (e.type === 'unavailable-id') { peer.destroy(); setTimeout(() => initPeer().then(res, rej), 1500) } else if (e.type === 'peer-unavailable') { /* partner not ready yet */ } else { console.warn(e); if (state !== 'live') toast('Lỗi kết nối: ' + e.type) } });
    peer.on('call', c => { if (call) call.close(); call = c; c.answer(stream); bindCall(c) });
    peer.on('disconnected', () => { try { peer.reconnect() } catch (e) { } });
  });
}
function bindCall(c) {
  c.on('stream', s => {
    $('#vThem').srcObject = s; $('#vThem').play().catch(() => { });
    if (state !== 'live') { setState('live'); setMsg(kind === 'audio' ? ctx.partnerName : '', kind === 'audio' ? (sleepMode ? 'Đang ngủ cùng nhau 🌙' : 'Đang gọi thoại…') : ''); startedAt = Date.now(); tick = setInterval(renderTimer, 1000); renderTimer(); vib(60); if (sleepMode) showSleep() }
  });
  c.on('close', () => { if (state === 'live') endCall(true) });
}
function renderTimer() { const s = Math.floor((Date.now() - startedAt) / 1000); $('#timer').textContent = fmt(s) }
const fmt = s => (s >= 3600 ? Math.floor(s / 3600) + ':' : '') + String(Math.floor(s / 60) % 60).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

async function startCall(k, viaInvite) {
  kind = k; logged = false; iStarted = !viaInvite;
  try { await getMedia() } catch (e) { toast('Không mở được ' + (k === 'video' ? 'camera/micro' : 'micro') + '. Cho phép quyền trong trình duyệt nhé'); return }
  setState('waiting'); setMsg('Đang chờ ' + ctx.partnerName + '…', viaInvite ? 'Đang kết nối' : 'Đã gửi lời mời gọi');
  try { await initPeer() } catch (e) { toast(e.message); endCall(false); return }
  if (!viaInvite) { invite(ctx, PAGE, sleepMode ? 'rủ ngủ cùng nhau 🌙' : kind === 'video' ? 'gọi video 📹' : 'gọi thoại 📞'); send('ring', { kind, sleep: sleepMode }) }
  announceReady(); clearInterval(readyLoop); readyLoop = setInterval(() => { if (state === 'waiting') announceReady(); else clearInterval(readyLoop) }, 3000);
  ringTimer = setTimeout(() => { if (state === 'waiting') { toast(ctx.partnerName + ' chưa bắt máy'); } }, 45000);
}
let ringTimer = null;
function announceReady() { send('ready', { kind, sleep: sleepMode }) }
function placeCall() { if (!peer || !stream || call) return; call = peer.call(pid(YOU), stream); if (call) bindCall(call) }

async function endCall(remote) {
  clearInterval(tick); clearTimeout(ringTimer); clearInterval(readyLoop);
  if (state === 'live' && startedAt && !logged) {
    logged = true; const dur = Math.round((Date.now() - startedAt) / 1000);
    if (iStarted && dur > 2) { await sb.from('calls').insert({ kind: sleepMode ? 'sleep' : kind, started_at: new Date(startedAt).toISOString(), ended_at: new Date().toISOString(), duration_sec: dur }); }
    toast('Đã gọi ' + fmt(dur)); setTimeout(loadHistory, 1200);
  }
  hideSleep(); sleepMode = false;
  if (!remote) send('hangup');
  try { call && call.close() } catch (e) { } call = null;
  try { peer && peer.destroy() } catch (e) { } peer = null;
  stream && stream.getTracks().forEach(t => t.stop()); stream = null;
  $('#vThem').srcObject = null; $('#vMe').srcObject = null; $('#vMe').classList.add('hidden');
  startedAt = null; micOn = true; camOn = true; $('#btnMic').classList.remove('off'); $('#btnCam').classList.remove('off');
  setState('idle');
}

ch.on('broadcast', { event: 'ready' }, ({ payload }) => {
  if (state === 'idle') { kind = payload.kind || 'video'; sleepMode = !!payload.sleep; ringIn(); return }
  if (state === 'waiting') { if (CALLER) setTimeout(placeCall, 400); else announceReady() }
})
  .on('broadcast', { event: 'ring' }, ({ payload }) => { if (state === 'idle') { kind = payload.kind || 'video'; sleepMode = !!payload.sleep; ringIn() } })
  .on('broadcast', { event: 'hangup' }, () => { if (state !== 'idle') { toast(ctx.partnerName + ' đã kết thúc cuộc gọi'); endCall(true) } })
  .subscribe();

function ringIn() {
  vib([300, 200, 300, 200, 300]);
  setMsg(sleepMode ? `${ctx.partnerName} rủ bạn ngủ cùng 🌙` : `${ctx.partnerName} đang gọi ${kind === 'video' ? 'video' : 'thoại'}…`, sleepMode ? 'Bấm 🌙 để vào' : 'Bấm nút xanh để nghe');
  $('#btnSleep').textContent = sleepMode ? '🌙 Vào ngủ cùng' : '🌙 Ngủ cùng nhau';
  $('#btnVideo').textContent = kind === 'video' ? '📹 Nghe máy' : '📹 Nghe (video)'; $('#btnAudio').textContent = kind === 'audio' ? '📞 Nghe máy' : '📞 Nghe (chỉ tiếng)';
  incoming = true;
}
let incoming = false;
$('#btnVideo').onclick = () => { sleepMode = false; startCall('video', incoming) };
$('#btnSleep').onclick = () => { sleepMode = true; startCall('audio', incoming) };
/* ---- sleep mode ---- */
const TIMERS = [['30m', 30], ['1 tiếng', 60], ['2 tiếng', 120], ['Đến 7h sáng', 'am'], ['Không tắt', 0]];
const NOISES = [['🔇 Yên lặng', 'off'], ['🌧️ Mưa', 'rain'], ['🌊 Sóng', 'wave'], ['🤍 Ồn trắng', 'white']];
function setSleepTimer(v) { if (v === 'am') { const d = new Date(); d.setHours(7, 0, 0, 0); if (d < new Date()) d.setDate(d.getDate() + 1); sleepEnd = d.getTime() } else sleepEnd = v ? Date.now() + v * 60e3 : 0; $$('#slTimer button').forEach(b => b.classList.toggle('on', String(b.dataset.v) === String(v))) }
function setNoise(k) { try { if (noise) { noise.src.stop(); noise.ac.close(); noise = null } if (k !== 'off') { const ac = new (window.AudioContext || window.webkitAudioContext)(); const buf = ac.createBuffer(1, ac.sampleRate * 4, ac.sampleRate); const d = buf.getChannelData(0); let last = 0; for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; last = (last + .02 * w) / 1.02; d[i] = k === 'white' ? w * .5 : last * 3.5 } const src = ac.createBufferSource(); src.buffer = buf; src.loop = true; const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = k === 'rain' ? 1400 : k === 'wave' ? 500 : 6000; const gn = ac.createGain(); gn.gain.value = k === 'white' ? .05 : .25; if (k === 'wave') { const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = .1; lg.gain.value = .18; lfo.connect(lg); lg.connect(gn.gain); lfo.start() } src.connect(f); f.connect(gn); gn.connect(ac.destination); src.start(); noise = { ac, src } } } catch (e) { } $$('#slNoise button').forEach(b => b.classList.toggle('on', b.dataset.k === k)) }
$('#slTimer').innerHTML = TIMERS.map(([l, v]) => `<button data-v="${v}">${l}</button>`).join(''); $('#slTimer').onclick = e => { const b = e.target.closest('button'); if (b) setSleepTimer(b.dataset.v === 'am' ? 'am' : +b.dataset.v) };
$('#slNoise').innerHTML = NOISES.map(([l, k]) => `<button data-k="${k}">${l}</button>`).join(''); $('#slNoise').onclick = e => { const b = e.target.closest('button'); if (b) setNoise(b.dataset.k) };
$('#slEnd').onclick = () => $('#btnEnd').click();
$('#slMic').onclick = () => { $('#btnMic').click(); $('#slMic').textContent = micOn ? '🎤 Mic đang bật' : '🔇 Mic đang tắt' };
let ctlT = null; const showCtl = () => { $('#slCtl').style.opacity = 1; clearTimeout(ctlT); ctlT = setTimeout(() => $('#slCtl').style.opacity = 0, 8000) };
$('#sleepOv').addEventListener('click', showCtl);
async function showSleep() {
  $('#sleepOv').classList.remove('hidden'); $('#slWho').textContent = `Đang ngủ cùng ${ctx.partnerName} 💤`; setSleepTimer(120); setNoise('off'); showCtl();
  try { wakeLock = await navigator.wakeLock?.request('screen') } catch (e) { }
  clearInterval(sleepTick); sleepTick = setInterval(() => { const d = new Date(); $('#slClock').textContent = d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }); if (sleepEnd && Date.now() > sleepEnd) { toast('Hết giờ, chúc ngủ ngon 🌙'); $('#btnEnd').click() } }, 1000);
  $('#slClock').textContent = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
}
function hideSleep() { $('#sleepOv').classList.add('hidden'); clearInterval(sleepTick); setNoise('off'); try { wakeLock && wakeLock.release() } catch (e) { } wakeLock = null; $('#btnSleep').textContent = '🌙 Ngủ cùng nhau' }
$('#btnAudio').onclick = () => startCall('audio', incoming);
$('#btnEnd').onclick = () => { incoming = false; $('#btnVideo').textContent = '📹 Gọi video'; $('#btnAudio').textContent = '📞 Gọi thoại'; endCall(false) };
$('#btnMic').onclick = () => { micOn = !micOn; stream && stream.getAudioTracks().forEach(t => t.enabled = micOn); $('#btnMic').classList.toggle('off', !micOn) };
$('#btnCam').onclick = () => { camOn = !camOn; stream && stream.getVideoTracks().forEach(t => t.enabled = camOn); $('#btnCam').classList.toggle('off', !camOn) };
$('#btnFlip').onclick = async () => {
  if (!stream || kind !== 'video') return;
  try {
    facing = facing === 'user' ? 'environment' : 'user';
    const ns = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing } }); const nt = ns.getVideoTracks()[0];
    const old = stream.getVideoTracks()[0]; if (old) { stream.removeTrack(old); old.stop() } stream.addTrack(nt);
    $('#vMe').srcObject = stream; $('#vMe').classList.toggle('back', facing !== 'user');
    const pc = call && call.peerConnection; if (pc) { const s = pc.getSenders().find(x => x.track && x.track.kind === 'video'); s && s.replaceTrack(nt) }
  } catch (e) { toast('Không đổi được camera'); facing = 'user' }
};
window.addEventListener('beforeunload', () => { if (state !== 'idle') { send('hangup') } });

/* history + stats */
async function loadHistory() {
  const { data } = await sb.from('calls').select('*').order('started_at', { ascending: false }).limit(500);
  const rows = data || []; const now = Date.now(); const startToday = new Date(); startToday.setHours(0, 0, 0, 0);
  const sum = f => Math.round(rows.filter(f).reduce((a, r) => a + r.duration_sec, 0) / 60);
  const hm = m => m >= 60 ? `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}` : m + "'";
  $('#sToday').textContent = hm(sum(r => new Date(r.started_at) >= startToday));
  $('#sWeek').textContent = hm(sum(r => now - new Date(r.started_at) < 7 * 864e5));
  $('#sAll').textContent = hm(sum(() => true));
  const longest = rows.reduce((a, r) => r.duration_sec > (a ? a.duration_sec : 0) ? r : a, null);
  $('#sLong').textContent = longest ? `Cuộc gọi dài nhất: ${fmt(longest.duration_sec)} (${new Date(longest.started_at).toLocaleDateString('vi-VN')}) · ${rows.length} cuộc gọi` : 'Chưa có cuộc gọi nào.';
  $('#hist').innerHTML = rows.slice(0, 30).map(r => `<div class="vrow"><span class="k">${r.kind === 'video' ? '📹' : r.kind === 'sleep' ? '🌙' : '📞'}</span><div class="t"><b>${fmt(r.duration_sec)}</b><span class="note" style="margin:0">${new Date(r.started_at).toLocaleString('vi-VN', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })} · ${r.started_by === ME ? 'bạn gọi' : esc(ctx.partnerName) + ' gọi'}</span></div></div>`).join('');
}
sb.channel('calls-db').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'calls' }, () => loadHistory()).subscribe();
setState('idle'); loadHistory();
const auto = new URLSearchParams(location.search).get('k'); if (auto === 'video' || auto === 'audio') { setTimeout(() => { setMsg(`${ctx.partnerName} đang gọi bạn`, 'Bấm nút xanh để nghe'); incoming = true }, 300) }
/* ===== 📸 Chụp photobooth ngay trong cuộc gọi video =====
   Dùng luôn camera & kết nối của cuộc gọi nên mượt y như gọi video. Mỗi máy chụp camera của chính mình
   đúng cùng một thời điểm (đồng bộ đồng hồ 2 máy), gửi ảnh nét cho nhau qua kho ảnh, rồi ghép thành dải ảnh. */
const SNAP_N = 4, SNAP_CD = 3, SNAP_GAP = 3;
let clockOff = null, clockRtt = 1e9, snap = null; const early = {};
ch.on('broadcast', { event: 'cping' }, ({ payload }) => send('cpong', { a: payload.a, b: Date.now() }))
  .on('broadcast', { event: 'cpong' }, ({ payload }) => { const rtt = Date.now() - payload.a; if (rtt <= clockRtt) { clockRtt = rtt; clockOff = payload.b - (payload.a + rtt / 2) } })
  .on('broadcast', { event: 'snap' }, ({ payload }) => { if (state === 'live' && kind === 'video') runSnap(payload.sid, clockOff != null ? payload.at - clockOff : Date.now() + 300, false) })
  .on('broadcast', { event: 'snapshot' }, ({ payload }) => gotShot(payload));
setInterval(() => { if (state === 'live') send('cping', { a: Date.now() }) }, 4000);
setInterval(() => { clockRtt *= 1.5 }, 30000);
let SAC = null; function beep(f, d = .09, v = .07) { try { SAC = SAC || new (window.AudioContext || window.webkitAudioContext)(); if (SAC.state === 'suspended') SAC.resume(); const o = SAC.createOscillator(), g = SAC.createGain(); o.frequency.value = f; g.gain.value = v; o.connect(g); g.connect(SAC.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, SAC.currentTime + d); o.stop(SAC.currentTime + d + .02) } catch (e) { } }
$('#btnSnap').onclick = () => {
  if (state !== 'live' || kind !== 'video' || snap) return; beep(1, .01, .0001);
  const sid = Date.now().toString(36) + Math.random().toString(36).slice(2, 5), at = Date.now() + (clockOff == null ? 900 : Math.min(2500, Math.max(700, clockRtt * 2 + 400)));
  send('snap', { sid, at }); runSnap(sid, at, true);
};
function countdownTo(target, label) {
  return new Promise(res => { const ov = $('#snapOv'), num = $('#snapNum'); ov.classList.remove('hidden'); $('#snapLbl').textContent = label; let shown = null;
    const tickf = () => { const left = target - Date.now(); if (left <= 0) { num.textContent = ''; res(); return } const n = Math.ceil(left / 1000); if (n !== shown) { shown = n; num.textContent = n; beep(n === 1 ? 1320 : 880) } setTimeout(tickf, Math.min(left, 50)) }; tickf() })
}
function grabMe() {
  const v = $('#vMe'); if (!v.videoWidth) return null; const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight; const x = c.getContext('2d');
  if (facing === 'user') { x.translate(c.width, 0); x.scale(-1, 1) } x.drawImage(v, 0, 0); return c;
}
const toBlob = c => new Promise(r => c.toBlob(r, 'image/jpeg', .92));
async function runSnap(sid, at, mine) {
  if (snap) return; snap = { sid, me: [], them: early[sid] || [], mine }; delete early[sid]; $('#btnSnap').disabled = true;
  try {
    for (let i = 0; i < SNAP_N; i++) {
      await countdownTo(at + (SNAP_CD + i * (SNAP_GAP + .6)) * 1000, `Kiểu ${i + 1} / ${SNAP_N} · nhìn vào camera nha`);
      const f = $('#snapFlash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); beep(1800, .05, .05); vib(30);
      const c = grabMe(); snap.me[i] = c;
      if (c) toBlob(c).then(b => uploadMedia(ctx, b, 'booth')).then(({ path }) => send('snapshot', { sid, i, path })).catch(e => console.warn(e));
    }
    $('#snapNum').textContent = '♡'; $('#snapLbl').textContent = 'Đang nhận ảnh từ ' + ctx.partnerName + '…';
    const t0 = Date.now(); while (snap.them.filter(Boolean).length < SNAP_N && Date.now() - t0 < 15000) await new Promise(r => setTimeout(r, 250));
    $('#snapOv').classList.add('hidden'); await showSnap(snap);
  } catch (e) { console.warn(e); toast('Chụp chưa được: ' + e.message) }
  finally { $('#snapOv').classList.add('hidden'); snap = null; $('#btnSnap').disabled = false }
}
async function gotShot(p) {
  try { const { data, error } = await sb.storage.from('media').download(p.path); if (error) throw error; const bm = await createImageBitmap(data); const c = document.createElement('canvas'); c.width = bm.width; c.height = bm.height; c.getContext('2d').drawImage(bm, 0, 0);
    if (snap && snap.sid === p.sid) snap.them[p.i] = c; else (early[p.sid] = early[p.sid] || [])[p.i] = c } catch (e) { console.warn(e) }
}
function cover(x, img, dx, dy, dw, dh) { if (!img) { x.fillStyle = '#f3e6ee'; x.fillRect(dx, dy, dw, dh); return } const s = Math.max(dw / img.width, dh / img.height), w = dw / s, h = dh / s; x.drawImage(img, (img.width - w) / 2, (img.height - h) / 2, w, h, dx, dy, dw, dh) }
function compose(S) {
  const cw = 330, chh = 248, pad = 28, gap = 12, foot = 130, W = pad * 2 + cw * 2 + gap, H = pad + SNAP_N * (chh + gap) - gap + foot; const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  x.fillStyle = '#ffd6e6'; x.fillRect(0, 0, W, H); x.fillStyle = 'rgba(255,255,255,.75)'; for (let y = 10, r = 0; y < H; y += 26, r++) for (let X = (r % 2) * 13 + 8; X < W; X += 26) { x.beginPath(); x.arc(X, y, 4, 0, 7); x.fill() }
  for (let i = 0; i < SNAP_N; i++) { const y = pad + i * (chh + gap); x.fillStyle = '#fff'; x.fillRect(pad - 5, y - 5, cw * 2 + gap + 10, chh + 10); cover(x, S.me[i], pad, y, cw, chh); cover(x, S.them[i], pad + cw + gap, y, cw, chh) }
  x.textAlign = 'center'; x.fillStyle = '#e0457b'; x.font = '700 40px "Dancing Script", "Baloo 2", cursive'; x.fillText(`${ctx.myName} ♡ ${ctx.partnerName}`, W / 2, H - foot + 62);
  x.font = '600 18px "Be Vietnam Pro", sans-serif'; x.fillStyle = '#b24a72'; x.fillText('📹 chụp trong cuộc gọi · ' + new Date().toLocaleDateString('vi-VN'), W / 2, H - foot + 98); return c;
}
// lưu ảnh từng kiểu vào máy (IndexedDB) để mở Booth chỉnh khung/filter sau khi gọi xong
function idbPut(key, val) { return new Promise(res => { try { const r = indexedDB.open('tomortle', 1); r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('album')) d.createObjectStore('album', { keyPath: 'id', autoIncrement: true }); if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv') }; r.onsuccess = () => { const t = r.result.transaction('kv', 'readwrite'); t.objectStore('kv').put(val, key); t.oncomplete = () => res(true); t.onerror = () => res(false) }; r.onerror = () => res(false) } catch (e) { res(false) } }) }
async function showSnap(S) {
  const strip = compose(S), blob = await toBlob(strip); const url = URL.createObjectURL(blob); $('#snapImg').src = url; $('#snapRes').classList.remove('hidden');
  const shots = []; for (let i = 0; i < SNAP_N; i++)shots.push({ me: S.me[i] ? await toBlob(S.me[i]) : null, them: S.them[i] ? await toBlob(S.them[i]) : null });
  await idbPut('callShots', { at: Date.now(), shots });
  $('#snapSave').onclick = () => { const a = document.createElement('a'); a.href = url; a.download = `photobooth-goi-video-${Date.now()}.jpg`; a.click() };
  $('#snapEdit').onclick = () => { $('#snapRes').classList.add('hidden'); toast('Ảnh đã chờ sẵn trong Booth ✨ Gọi xong mở Booth để đổi khung, filter, sticker nhé') };
  $('#snapClose').onclick = () => $('#snapRes').classList.add('hidden');
  // chỉ người bấm chụp lưu vào Album chung (tránh 2 bản trùng)
  if (S.mine) try { const { path } = await uploadMedia(ctx, blob, 'album'); await sb.from('album').insert({ path, source: 'booth', taken_at: new Date().toISOString() }); toast('Đã lưu vào Album chung 💗') } catch (e) { console.warn(e) }
}
