<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quà tặng – Tomortle × Molly</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;600;800&family=Patrick+Hand&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <div class="card">
    <h3>🎀 Tặng quà cho <span class="pn"></span></h3>
    <div class="giftgrid" id="grid"></div>
    <input class="input" id="msg" maxlength="300" placeholder="Lời nhắn kèm (không bắt buộc)" style="margin-top:10px">
    <button class="btn primary block" id="send" style="margin-top:10px">Gửi quà</button>
  </div>
  <div class="card">
    <h3>🛍️ Gửi quà thật</h3>
    <p class="note">Đặt đồ giao tận nơi cho người ấy. Nhớ nhập đúng địa chỉ của người ấy nhé.</p>
    <div class="tiles">
      <a class="tile" href="https://food.grab.com/vn/vi/" target="_blank" rel="noopener"><i>🧋</i>GrabFood<small>Trà sữa, đồ ăn</small></a>
      <a class="tile" href="https://shopeefood.vn/" target="_blank" rel="noopener"><i>🍰</i>ShopeeFood<small>Bánh, đồ ăn</small></a>
      <a class="tile" href="https://shopee.vn/search?keyword=hoa%20t%C6%B0%C6%A1i" target="_blank" rel="noopener"><i>💐</i>Hoa tươi<small>Shopee</small></a>
    </div>
  </div>
  <div class="card"><h3>🎁 Tủ quà của bạn <small id="cnt"></small></h3><div class="shelf" id="shelf"></div><div class="list" id="recent" style="margin-top:10px"></div></div>
</div>
<div id="toast"></div><div class="fx" id="fx"></div>
<script type="module">
import { $, $$, esc, toast, vib, hearts, sb, boot, header, joinMain, ping, ago } from './common.js';
header('Quà tặng');
const ctx = await boot();
joinMain(ctx, 'gifts');
const ME = ctx.me.id, YOU = ctx.partnerId;
$$('.pn').forEach(e => e.textContent = ctx.partnerName);
export const GIFTS = [['🌹', 'Hoa hồng'], ['💐', 'Bó hoa'], ['🧋', 'Trà sữa'], ['🍫', 'Sô-cô-la'], ['🧸', 'Gấu bông'], ['🎂', 'Bánh kem'], ['🍓', 'Dâu tây'], ['☕', 'Cà phê'], ['🌙', 'Ngủ ngon'], ['💋', 'Nụ hôn'], ['🫂', 'Cái ôm'], ['💍', 'Lời hứa']];
let pick = 0;
$('#grid').innerHTML = GIFTS.map(([e, n], i) => `<button data-i="${i}" class="${i === 0 ? 'on' : ''}">${e}<small>${n}</small></button>`).join('');
$('#grid').onclick = e => { const b = e.target.closest('button'); if (!b) return; pick = +b.dataset.i; $$('#grid button').forEach(x => x.classList.toggle('on', x === b)) };
$('#send').onclick = async () => {
  const [e, n] = GIFTS[pick]; const message = $('#msg').value.trim() || null;
  const { error } = await sb.from('vgifts').insert({ to_id: YOU, gift: e + ' ' + n, message });
  if (error) { toast('Lỗi: ' + error.message); return }
  ping(ctx, 'vgift', { gift: e + ' ' + n, message }); $('#msg').value = ''; hearts(8); toast(`Đã tặng ${n} cho ${ctx.partnerName}`); load();
};
async function load() {
  const { data } = await sb.from('vgifts').select('*').order('created_at', { ascending: false }).limit(300);
  const all = data || []; const mine = all.filter(g => g.to_id === ME);
  const count = {}; mine.forEach(g => { const e = g.gift.split(' ')[0]; count[e] = (count[e] || 0) + 1 });
  $('#shelf').innerHTML = Object.entries(count).map(([e, c]) => `<span>${e} ×${c}</span>`).join('') || '<p class="note">Chưa nhận món quà nào.</p>';
  $('#cnt').textContent = mine.length ? mine.length + ' món' : '';
  $('#recent').innerHTML = all.slice(0, 15).map(g => `<div class="vrow"><span class="k">${esc(g.gift.split(' ')[0])}</span><div class="t"><b>${g.from_id === ME ? 'Bạn tặng ' + esc(ctx.partnerName) : esc(ctx.partnerName) + ' tặng bạn'} ${esc(g.gift.split(' ').slice(1).join(' '))}</b>${g.message ? `<div>${esc(g.message)}</div>` : ''}<span class="note" style="margin:0">${ago(g.created_at)}</span></div></div>`).join('');
  for (const g of mine.filter(g => !g.seen_at)) sb.rpc('vgift_seen', { gid: g.id });
}
ctx.main.on('broadcast', { event: 'vgift' }, () => load());
load();
</script>
</body>
</html>
